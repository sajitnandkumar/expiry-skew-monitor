services:
  - type: web
    name: expiry-skew-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SMARTAPI_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: AUTH_MODE
        value: publisher
      - key: PYTHON_VERSION
        value: 3.12.6
